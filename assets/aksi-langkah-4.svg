<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3eff8"/>
      <stop offset="100%" stop-color="#e3daf2"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3d2861" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad4)"/>

  <!-- Ambient circles -->
  <circle cx="80" cy="50" r="45" fill="#d2bee6" opacity="0.35"/>
  <circle cx="340" cy="180" r="55" fill="#c3a8dc" opacity="0.4"/>

  <!-- Center Frame -->
  <rect x="50" y="30" width="300" height="180" rx="14" fill="#ffffff" opacity="0.88" filter="url(#shadow4)"/>

  <!-- Student 1 Avatar / Body (Left) -->
  <g transform="translate(100, 60)">
    <!-- Head -->
    <circle cx="30" cy="24" r="16" fill="#f5d0b5"/>
    <!-- Hair -->
    <path d="M14,24 C14,12 22,8 30,8 C38,8 46,12 46,24 C40,16 34,16 26,18 Z" fill="#2d3748"/>
    <!-- Body / Uniform -->
    <path d="M10,75 C10,50 20,44 30,44 C40,44 50,50 50,75 Z" fill="#2f7654"/>
    <!-- Collar -->
    <polygon points="26,44 34,44 30,52" fill="#ffffff"/>
  </g>

  <!-- Energy Checklist Clipboard (Center) -->
  <g transform="translate(170, 48)">
    <!-- Board -->
    <rect x="0" y="8" width="60" height="85" rx="6" fill="#f8f9fa" stroke="#c4ccd3" stroke-width="2"/>
    <!-- Metal clip -->
    <rect x="18" y="2" width="24" height="10" rx="3" fill="#6c757d"/>
    <circle cx="30" cy="7" r="2.5" fill="#ffffff"/>
    <!-- Checklist items with green checkmarks -->
    <circle cx="14" cy="26" r="5" fill="#2f7654"/>
    <path d="M11 26 L13 28 L17 24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="24" y1="26" x2="48" y2="26" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="14" cy="44" r="5" fill="#2f7654"/>
    <path d="M11 44 L13 46 L17 42" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="24" y1="44" x2="48" y2="44" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="14" cy="62" r="5" fill="#2f7654"/>
    <path d="M11 62 L13 64 L17 60" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="24" y1="62" x2="48" y2="62" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Star badge -->
    <circle cx="48" cy="78" r="9" fill="#ffd43b"/>
    <polygon points="48,72 50,76 54,77 51,80 52,84 48,82 44,84 45,80 42,77 46,76" fill="#8f6300"/>
  </g>

  <!-- Student 2 Avatar / Body (Right) -->
  <g transform="translate(240, 60)">
    <!-- Head -->
    <circle cx="30" cy="24" r="16" fill="#f2c8a7"/>
    <!-- Hair -->
    <path d="M12,24 C12,10 20,6 30,6 C40,6 48,10 48,24 C46,14 36,12 28,15 Z" fill="#5a3825"/>
    <!-- Body / Uniform -->
    <path d="M10,75 C10,50 20,44 30,44 C40,44 50,50 50,75 Z" fill="#20583d"/>
    <!-- Collar -->
    <polygon points="26,44 34,44 30,52" fill="#d7ed86"/>
  </g>

  <!-- Speech bubble: Saling Mengingatkan -->
  <g transform="translate(140, 22)">
    <rect x="0" y="0" width="120" height="22" rx="11" fill="#4d3278"/>
    <polygon points="60,22 65,27 70,22" fill="#4d3278"/>
    <text x="60" y="15" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">&#128077; Piket Energi Kelas</text>
  </g>

  <!-- Bottom pill -->
  <g transform="translate(95, 178)">
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#4d3278"/>
    <circle cx="16" cy="13" r="5" fill="#f0c05a"/>
    <text x="112" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Duta Energi: Saling Ingatkan Santun</text>
  </g>
</svg>

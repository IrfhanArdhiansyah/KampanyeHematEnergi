<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Ilustrasi lampu hemat energi dengan daun di dalamnya</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#d9ed68" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d9ed68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef0"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
  </defs>

  <!-- cahaya latar -->
  <circle cx="200" cy="190" r="185" fill="url(#glow)"/>
  <circle cx="200" cy="195" r="140" fill="#e6f2b0" opacity="0.55"/>

  <!-- sinar -->
  <g stroke="#a9bd39" stroke-width="7" stroke-linecap="round">
    <line x1="200.0" y1="47.0" x2="200.0" y2="23.0"/>
    <line x1="267.7" y1="68.3" x2="281.4" y2="48.7"/>
    <line x1="132.3" y1="68.3" x2="118.6" y2="48.7"/>
    <line x1="310.9" y1="124.6" x2="333.4" y2="116.4"/>
    <line x1="89.1" y1="124.6" x2="66.6" y2="116.4"/>
  </g>

  <!-- kaca lampu -->
  <path d="M142 250 C112 224 100 196 100 165 A100 100 0 0 1 300 165 C300 196 288 224 258 250 L258 266 L142 266 Z"
        fill="url(#glass)" stroke="#1f2d24" stroke-width="8" stroke-linejoin="round"/>

  <!-- kilau kaca -->
  <path d="M128 140 C130 112 150 90 176 82" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <!-- daun di dalam lampu -->
  <path d="M200 262 L200 222" stroke="#4f6b14" stroke-width="6" stroke-linecap="round"/>
  <path d="M200 226 C150 205 150 150 200 118 C250 150 250 205 200 226 Z"
        fill="#a9bd39" stroke="#4f6b14" stroke-width="6" stroke-linejoin="round"/>
  <path d="M200 134 L200 218" stroke="#4f6b14" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 168 L176 150 M200 168 L224 150 M200 194 L180 178 M200 194 L220 178" stroke="#4f6b14" stroke-width="4" stroke-linecap="round"/>

  <!-- dudukan -->
  <rect x="146" y="270" width="108" height="16" rx="8" fill="#1f2d24"/>
  <rect x="154" y="290" width="92" height="16" rx="8" fill="#1f2d24"/>
  <rect x="176" y="310" width="48" height="16" rx="8" fill="#1f2d24"/>

  <!-- percikan -->
  <g fill="#d4a323">
    <circle cx="66" cy="120" r="6"/>
    <circle cx="338" cy="96" r="5"/>
    <circle cx="352" cy="228" r="4"/>
  </g>
  <g fill="#7c971e">
    <circle cx="48" cy="236" r="4"/>
    <circle cx="316" cy="300" r="6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>